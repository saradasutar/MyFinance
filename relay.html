<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>MyFinance Relay</title>
</head>
<body>
<script>
(function(){
  try{
    var q=new URLSearchParams(window.location.search);
    var rid=q.get('rid')||'';
    var requestId=q.get('requestId')||'';
    if(!rid||!requestId)return;
    if(window.parent&&window.parent!==window){
      window.parent.postMessage({
        __myfinanceRelayTicket:true,
        rid:rid,
        requestId:requestId
      },window.location.origin);
    }
  }catch(e){}
})();
</script>
</body>
</html>
